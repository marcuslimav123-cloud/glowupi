kind = "slides"
previewPath = "/pitch-investidor/"
title = "Glow Upi — Pitch Investidor"
version = "1.0.0"
id = "artifacts/pitch-investidor"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pitch-investidor/" ]
localPort = 20073

[services.development]
run = "pnpm --filter @workspace/pitch-investidor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pitch-investidor", "run", "build" ]
publicDir = "artifacts/pitch-investidor/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20073"
BASE_PATH = "/pitch-investidor/"
